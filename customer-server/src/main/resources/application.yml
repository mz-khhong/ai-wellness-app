spring:
  application:
    name: customer-server
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-postgresql.yml
  datasource:
    # PostgreSQL 설정
    url: jdbc:postgresql://localhost:5432/aiwellnessdb
    driver-class-name: org.postgresql.Driver
    username: aiuser
    password: mzaiuser@@
server:
  port: 8082

logging:
  level:
    root: INFO
    com.aiwellness: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

