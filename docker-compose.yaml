services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-wellness-postgres
    environment:
      POSTGRES_DB: aiwellnessdb
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: mzaiuser@@
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d aiwellnessdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

