# Common 모듈 설정
jwt:
  secret: ai-wellness-app-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hmac-sha-algorithm
  expiration: 86400000 # 24 hours
  algorithm: ${JWT_ALGORITHM:HS256}  # HS256 (기본값) 또는 RS256
  # RS256 사용 시 아래 키 설정 필요
  rs256:
    private-key: ${JWT_RS256_PRIVATE_KEY:}  # Base64 인코딩된 Private Key
    public-key: ${JWT_RS256_PUBLIC_KEY:}    # Base64 인코딩된 Public Key

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.aiwellness.**.domain.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    # MyBatis 로깅 설정
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 쿼리 추적을 위한 설정
    cache-enabled: true
    lazy-loading-enabled: false
    aggressive-lazy-loading: false

# Swagger/OpenAPI 설정 (기본값: 활성화)
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}  # 기본값: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}  # 기본값: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    filter: true
  # Swagger 정보 설정
  info:
    title: ${SWAGGER_TITLE:Wellness App API Documentation}
    description: ${SWAGGER_DESCRIPTION:Wellness App의 API 문서입니다.}
    version: ${SWAGGER_VERSION:1.0.0}
    contact:
      name: ${SWAGGER_CONTACT_NAME:Wellness App Team}
      email: ${SWAGGER_CONTACT_EMAIL:dev@wellness.com}
    license:
      name: ${SWAGGER_LICENSE_NAME:Apache 2.0}
      url: ${SWAGGER_LICENSE_URL:https://www.apache.org/licenses/LICENSE-2.0.html}
    servers:
      - url: ${SWAGGER_SERVER_URL:http://localhost:8080}
        description: ${SWAGGER_SERVER_DESCRIPTION:Wellness App Server}

# 필터 설정 (공통)
# TraceIdFilter, HttpLoggingFilter에서 제외할 경로 목록
filter:
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs
    - /api-docs
    - /webjars
    - /swagger-resources

# Spring Security 설정 (공통)
# 인증 없이 접근 가능한 경로 목록 (Public endpoints)
security:
  public-paths:
    - /api/v1/auth/**
    - /api/v1/messages/**  # 메시지 이벤트 발행 API (테스트용, 인증 없음)
    - /actuator/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /api-docs/**
    - /swagger-resources/**
    - /webjars/**

# 로깅 설정 (공통)
logging:
  level:
    com.aiwellness.common.persistence.interceptor.MyBatisQueryInterceptor: INFO
  http:
    enabled: ${LOGGING_HTTP_ENABLED:true}  # 기본값: true
    max-body-length: ${LOGGING_HTTP_MAX_BODY_LENGTH:300}  # HTTP 로깅 시 Body 최대 길이 (초과 시 잘림), 기본값: 300자

# Kafka 설정 (공통)
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}  # all: 모든 리더와 팔로워가 메시지를 받았을 때까지 대기
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        max.in.flight.requests.per.connection: ${KAFKA_MAX_IN_FLIGHT_REQUESTS:5}
        enable.idempotence: ${KAFKA_ENABLE_IDEMPOTENCE:true}  # 중복 방지
        # 연결 타임아웃 설정 (밀리초)
        connections.max.idle.ms: ${KAFKA_CONNECTIONS_MAX_IDLE_MS:540000}  # 9분
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}  # 30초
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}  # 2분
        # 메타데이터 관련 설정
        metadata.max.age.ms: ${KAFKA_METADATA_MAX_AGE_MS:300000}  # 5분
        # 연결 재시도 설정
        reconnect.backoff.ms: ${KAFKA_RECONNECT_BACKOFF_MS:50}
        retry.backoff.ms: ${KAFKA_RETRY_BACKOFF_MS:100}
    # Consumer 설정은 이 프로젝트에서 사용하지 않음 (메시지 발행만 수행)

# 외부 SSO 연계 설정 (공통)
# 각 서버에서 필요시 오버라이드 가능
external:
  sso:
    url: ${EXTERNAL_SSO_URL:}  # SSO 서버 URL (예: https://sso.example.com)
    client-id: ${EXTERNAL_SSO_CLIENT_ID:}  # SSO 클라이언트 ID
    client-secret: ${EXTERNAL_SSO_CLIENT_SECRET:}  # SSO 클라이언트 시크릿
    token:
      refresh-before-expiry: ${EXTERNAL_SSO_TOKEN_REFRESH_BEFORE_EXPIRY:300}  # 토큰 만료 5분 전 갱신