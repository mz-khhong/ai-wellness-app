# Validation Messages
validation.NotNull=This value is required and cannot be null.
validation.NotBlank=This value is required and cannot be blank.
validation.NotEmpty=This value is required and cannot be empty.
validation.Size=The length must be between {min} and {max}.
validation.Min=must be greater than or equal to {value}
validation.Max=must be less than or equal to {value}
validation.Pattern=must match the pattern: {regexp}
validation.regex.email=The email format is invalid.
validation.regex.phoneNumber=The phone number format is invalid. (e.g., 010-1234-5678)
validation.regex.password=Password must be at least 8 characters and include letters, numbers, and special characters.
validation.regex.name=Name must be 2-50 characters in Korean or English.
validation.regex.uuid=The UUID format is invalid.
validation.regex.birthday=The birthday format is invalid. (e.g., YYYYMMDD)
validation.regex.dateFormat=The date format is incorrect. (e.g., YYYY-MM-DD)
validation.regex.dateTimeFormat=The date-time format is incorrect. (e.g., YYYY-MM-DD HH:mm:ss)

