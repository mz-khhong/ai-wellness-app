plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.4'
}

// 리소스 파일을 jar에 포함
processResources {
    enabled = true
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.0'
    }
}

dependencies {
    // Spring Boot Starters (provided scope)
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-aop'
    
    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Nimbus JOSE + JWT (JwtUtils에서 사용)
    api 'com.nimbusds:nimbus-jose-jwt:9.37.3'
    
    // MyBatis
    api 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    
    // Database
    // H2는 제거됨 (PostgreSQL 사용)
    api 'org.postgresql:postgresql'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Apache Commons
    api 'org.apache.commons:commons-lang3:3.14.0'
    api 'org.apache.commons:commons-collections4:4.4'
    
    // Jackson
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Swagger/OpenAPI
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // Spring Cloud OpenFeign (서비스 간 통신용)
    api 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.1'
    
    // Logging
    api 'net.logstash.logback:logstash-logback-encoder:7.4'
}

// QueryDSL은 제거됨 (MyBatis 사용)
