# 스테이징 환경 설정
spring:
  config:
    activate:
      on-profile: stg
  
  # 로깅 레벨
  logging:
    level:
      root: INFO
      com.aiwellness: INFO
      org.springframework.web: INFO
    # HTTP 요청/응답 로깅 활성화 여부 (서버별 오버라이드 가능)
    http:
      enabled: ${LOGGING_HTTP_ENABLED:true}  # 기본값: true, application-common-stg.yml에서 상속
  
  # 데이터베이스 설정 (스테이징 환경: PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:stg-db.example.com}:${DB_PORT:5432}/${DB_NAME:aiwellnessdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:aiuser}
    password: ${DB_PASSWORD:mzaiuser@@}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000