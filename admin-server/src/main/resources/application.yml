spring:
  application:
    name: admin-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 기본값: dev, 환경 변수로 변경 가능
  config:
    import:
      - classpath:application-common.yml
  datasource:
    # PostgreSQL 설정
    url: jdbc:postgresql://localhost:5432/aiwellnessdb
    driver-class-name: org.postgresql.Driver
    username: aiuser
    password: mzaiuser@@

server:
  port: 8080

logging:
  level:
    root: INFO
    # Application 로그 - 기본은 INFO, 상세 로그는 DEBUG로
    com.aiwellness: INFO
    # 필요한 것만 INFO로 유지
    com.aiwellness.common.logging.HttpLoggingFilter: INFO
    com.aiwellness.common.exception: INFO
    com.aiwellness.common.security: INFO
    # Query 로깅은 INFO 유지
    org.apache.ibatis: INFO
    java.sql: INFO
    java.sql.Statement: INFO
    java.sql.PreparedStatement: INFO
    java.sql.ResultSet: INFO
    # Controller, Service, Adapter 등의 상세 로그는 DEBUG로
    com.aiwellness.admin.adapter.web: DEBUG
    com.aiwellness.admin.application.service: DEBUG
    com.aiwellness.admin.adapter.persistence: DEBUG
    com.aiwellness.admin.adapter.security: DEBUG
    # Spring Framework 로그는 최소화
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.boot: WARN
    org.springframework.context: WARN
  # 로그 패턴은 logback-spring.xml에서 중앙 관리됩니다.
  # 서버별로 다른 패턴이 필요한 경우에만 여기에 정의합니다.

# Swagger API 경로 설정 (admin-server 전용)
# 각 서버별로 명시적으로 API 경로를 설정합니다.
swagger:
  use-default-pattern: false  # 기본 패턴 사용 안 함
  api-paths:
    # Common 모듈의 공통 API 경로(/api/v1/auth/**)는
    # SwaggerPathConfig에서 자동으로 추가되므로 여기에 명시할 필요가 없습니다.
    - /api/v1/admins/**
    - /api/v1/mybody/**
  info:
    title: Admin Server API Documentation
    description: Admin Server의 API 문서입니다.
    servers:
      - url: http://localhost:8080
        description: Admin Server

# 외부 SSO 연계 API 설정 (admin-server 전용)
external:
  sso:
    api:
      url: ${EXTERNAL_SSO_API_URL:}  # 외부 SSO 연계 API 서버 URL (예: https://api.external-sso.com)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

